<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#000000">
  <meta name="description" content="Minimalist monochrome topographic screensaver with a 24-hour mechanical flip clock">
  <title>rtoms screensaver</title>
  <link rel="stylesheet" href="style.css">
</head>
<body data-theme="monochrome">
  <!-- Topography Canvas Background -->
  <canvas id="bg-canvas"></canvas>

  <!-- Top-Left Prominent Title Header -->
  <header class="header-container">
    <div class="site-title" id="site-title">
      <span class="title-subheading">hello</span>
      <h1 class="title-heading">rtoms</h1>
    </div>
  </header>

  <!-- Main Centered Flip Clock & Frosted Date -->
  <main class="clock-stage">
    <div class="clock-wrapper">
      <div class="clock-container" id="flip-clock" aria-label="24-hour flip clock">
        <!-- Hours Group -->
        <div class="digit-pair" id="hours-group">
          <div class="flip-unit" id="h0" data-digit="0">
            <div class="card-half top static"><span class="digit-num">0</span></div>
            <div class="card-half bottom static"><span class="digit-num">0</span></div>
            <div class="card-half top flap"><span class="digit-num">0</span></div>
            <div class="card-half bottom flap"><span class="digit-num">0</span></div>
          </div>
          <div class="flip-unit" id="h1" data-digit="0">
            <div class="card-half top static"><span class="digit-num">0</span></div>
            <div class="card-half bottom static"><span class="digit-num">0</span></div>
            <div class="card-half top flap"><span class="digit-num">0</span></div>
            <div class="card-half bottom flap"><span class="digit-num">0</span></div>
          </div>
        </div>

        <!-- Colon Separator -->
        <div class="clock-separator">:</div>

        <!-- Minutes Group -->
        <div class="digit-pair" id="minutes-group">
          <div class="flip-unit" id="m0" data-digit="0">
            <div class="card-half top static"><span class="digit-num">0</span></div>
            <div class="card-half bottom static"><span class="digit-num">0</span></div>
            <div class="card-half top flap"><span class="digit-num">0</span></div>
            <div class="card-half bottom flap"><span class="digit-num">0</span></div>
          </div>
          <div class="flip-unit" id="m1" data-digit="0">
            <div class="card-half top static"><span class="digit-num">0</span></div>
            <div class="card-half bottom static"><span class="digit-num">0</span></div>
            <div class="card-half top flap"><span class="digit-num">0</span></div>
            <div class="card-half bottom flap"><span class="digit-num">0</span></div>
          </div>
        </div>

        <!-- Colon Separator -->
        <div class="clock-separator">:</div>

        <!-- Seconds Group -->
        <div class="digit-pair" id="seconds-group">
          <div class="flip-unit" id="s0" data-digit="0">
            <div class="card-half top static"><span class="digit-num">0</span></div>
            <div class="card-half bottom static"><span class="digit-num">0</span></div>
            <div class="card-half top flap"><span class="digit-num">0</span></div>
            <div class="card-half bottom flap"><span class="digit-num">0</span></div>
          </div>
          <div class="flip-unit" id="s1" data-digit="0">
            <div class="card-half top static"><span class="digit-num">0</span></div>
            <div class="card-half bottom static"><span class="digit-num">0</span></div>
            <div class="card-half top flap"><span class="digit-num">0</span></div>
            <div class="card-half bottom flap"><span class="digit-num">0</span></div>
          </div>
        </div>
      </div>

      <!-- Current Date in Month Date and Year format (Frosted Glass Pill) -->
      <div class="clock-date" id="clock-date">
        <span class="date-text" id="date-text">November 14, 2026</span>
      </div>
    </div>
  </main>

  <!-- Bottom Screensaver HUD / Frosted Glass Action Bar (Shows when cursor is at bottom) -->
  <footer class="hud-bar" id="hud-bar">
    <button class="hud-btn" id="theme-badge" type="button" aria-label="Cycle Theme">
      <span class="btn-icon">🎨</span>
      <span class="btn-label">Theme: B&W [T]</span>
    </button>
    <button class="hud-btn" id="density-badge" type="button" aria-label="Cycle Density">
      <span class="btn-icon">〰️</span>
      <span class="btn-label">Density: Medium [M]</span>
    </button>
    <button class="hud-btn" id="pause-badge" type="button" aria-label="Pause or Resume">
      <span class="btn-icon">▶</span>
      <span class="btn-label">Live [Space]</span>
    </button>
    <button class="hud-btn" id="fullscreen-badge" type="button" aria-label="Toggle Fullscreen">
      <span class="btn-icon">⛶</span>
      <span class="btn-label">Fullscreen [F]</span>
    </button>
  </footer>

  <!-- Frosted Glass Hint Banner on First Launch -->
  <div class="kiosk-hint" id="kiosk-hint">
    <span>Click anywhere or press <strong>F</strong> for fullscreen</span>
  </div>

  <script src="topography.js"></script>
  <script src="app.js"></script>
</body>
</html>
